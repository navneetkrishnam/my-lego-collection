<text x="545" y="190" font-family="Arial, sans-serif" font-size="19" fill="#343c3d" text-anchor="start" dominant-baseline="hanging">Ten planted terracotta pots</text>
<text x="545" y="226" font-family="Arial, sans-serif" font-size="17" fill="#343c3d" text-anchor="start" dominant-baseline="hanging">Unequal spacing and varied plants</text>
<text x="545" y="267" font-family="Arial, sans-serif" font-size="17" fill="#343c3d" text-anchor="start" dominant-baseline="hanging">Green: full plant envelope</text>
<text x="545" y="301" font-family="Arial, sans-serif" font-size="17" fill="#343c3d" text-anchor="start" dominant-baseline="hanging">Tan: level supporting pad</text>
<text x="545" y="358" font-family="Arial, sans-serif" font-size="17" fill="#343c3d" text-anchor="start" dominant-baseline="hanging">The original tread alignment remains.</text>
<text x="545" y="400" font-family="Arial, sans-serif" font-size="17" fill="#343c3d" text-anchor="start" dominant-baseline="hanging">Pads span adjacent steps and are</text>
<text x="545" y="429" font-family="Arial, sans-serif" font-size="17" fill="#343c3d" text-anchor="start" dominant-baseline="hanging">supported down into the stair volume.</text>
<text x="40" y="1160" font-family="Arial, sans-serif" font-size="18" fill="#343c3d" text-anchor="start" dominant-baseline="hanging">Additional climbing roses grow beside the landings, outside the stair guards.</text>
<text x="40" y="1205" font-family="Arial, sans-serif" font-size="15" fill="#343c3d" text-anchor="start" dominant-baseline="hanging">Architectural proxy · physical LEGO connections and structural performance unverified</text></svg>