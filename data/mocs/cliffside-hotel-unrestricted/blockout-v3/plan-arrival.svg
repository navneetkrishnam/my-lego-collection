<text x="45" y="1144" font-family="Arial, sans-serif" font-size="18" fill="#343c3d" text-anchor="start" dominant-baseline="hanging">Main garden is beside the lobby. The cottage garden is a destination, not the route to other facilities.</text>
<text x="45" y="1178" font-family="Arial, sans-serif" font-size="18" fill="#343c3d" text-anchor="start" dominant-baseline="hanging">Pool deck: 7 studs clear at both sides; 9.5 behind and 11 in front, between coping and guards.</text>
<text x="45" y="1212" font-family="Arial, sans-serif" font-size="18" fill="#343c3d" text-anchor="start" dominant-baseline="hanging">Loungers occupy the front band; a 4.5-stud strip between coping and loungers stays clear.</text>
